title: Metrics adoption on Elastic Observability
teaser: Metrics on Elastic—OTLP to live metrics-*, PromQL boards, Datadog metric IP,
  ES|QL/columnar depth, and Agent Builder notes.
description: |
  Hands-on metrics adoption for existing Elastic customers. Topics: (1) OTLP → live
  metrics-* alongside logs/traces; (2) Prometheus/PromQL Grafana boards → Kibana without
  redrawing every panel; (3) Datadog dashboards + monitors → Kibana boards and alert
  drafts (review before enable); (4) PromQL where you already live, ES|QL + columnar
  metrics where Elastic wins; (5) Agent Builder AI notes on live dashboards. Engine:
  elastic/observability-migration-platform. Invite: docs/invite.md.
